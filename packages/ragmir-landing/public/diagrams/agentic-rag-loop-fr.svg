<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="title">La boucle du RAG agentique avec Ragmir</title>
  <desc id="desc">Une tâche amène l’agent à décider s’il a besoin de preuves. Si non, il répond ou agit. Si oui, il appelle ragmir_search avec la question et jusqu’à cinq formulations. Un résultat vide amène l’agent à dire que les documents ne couvrent pas la question. Les citations mènent à ragmir_expand sur le passage retenu. Si les preuves ne suffisent pas, l’agent cherche à nouveau ; sinon il répond ou agit en citant les preuves.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a3a3"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#000000"/>
  <g fill="#0f0f0f" stroke="#3f3f3f" stroke-width="1.5">
    <rect x="20" y="30" width="200" height="56" rx="12"/>
    <rect x="280" y="30" width="240" height="56" rx="28"/>
    <rect x="580" y="30" width="190" height="56" rx="12"/>
    <rect x="280" y="140" width="240" height="64" rx="12"/>
    <rect x="280" y="258" width="240" height="56" rx="28"/>
    <rect x="580" y="258" width="190" height="56" rx="12"/>
    <rect x="280" y="368" width="240" height="64" rx="12"/>
    <rect x="280" y="478" width="240" height="56" rx="28"/>
  </g>
  <g fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">
    <text x="120" y="63">Tâche ou question</text>
    <text x="400" y="63">Preuves nécessaires ?</text>
    <text x="675" y="55">Répondre ou agir,</text>
    <text x="675" y="74">en citant la preuve</text>
    <text x="400" y="168" font-family="ui-monospace, Menlo, monospace">ragmir_search</text>
    <text x="400" y="291">Des résultats ?</text>
    <text x="675" y="282">Indiquer l’absence</text>
    <text x="675" y="301">dans les documents</text>
    <text x="400" y="396" font-family="ui-monospace, Menlo, monospace">ragmir_expand</text>
    <text x="400" y="511">Preuves suffisantes ?</text>
  </g>
  <g fill="#a3a3a3" font-size="12.5" text-anchor="middle">
    <text x="400" y="189">question + jusqu’à 5 formulations</text>
    <text x="400" y="417">lire le passage retenu</text>
  </g>
  <g fill="none" stroke="#a3a3a3" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M220 58 H272"/>
    <path d="M520 58 H572"/>
    <path d="M400 86 V132"/>
    <path d="M400 204 V250"/>
    <path d="M520 286 H572"/>
    <path d="M400 314 V360"/>
    <path d="M400 432 V470"/>
    <path d="M280 506 H162 Q150 506 150 494 V184 Q150 172 162 172 H272"/>
    <path d="M520 506 H776 Q788 506 788 494 V70 Q788 58 778 58"/>
  </g>
  <g fill="#d4d4d4" font-size="12.5" font-weight="600">
    <text x="532" y="50">non</text>
    <text x="408" y="115">oui</text>
    <text x="527" y="278">vide</text>
    <text x="408" y="343">citations</text>
    <text x="180" y="498">non</text>
    <text x="532" y="498">oui</text>
  </g>
</svg>
